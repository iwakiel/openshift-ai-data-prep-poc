[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "retail-banking-data-prep"
version = "0.1.0"
description = "Data preparation pipeline for retail banking ML use cases on OpenShift AI"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "boto3>=1.34.0",
    "great-expectations>=0.18.12",
    "ydata-profiling>=4.6.0",
    "faker>=22.0.0",
    "sdv>=1.9.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
pipeline = ["kfp>=2.5.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
